services:
  memdock:
    build: .
    image: memdock:local
    restart: unless-stopped
    environment:
      MEMDOCK_ADDR: :8080
      MEMDOCK_DB_PATH: /data/memdock.db
      MEMDOCK_MODE: ${MEMDOCK_MODE:-private}
      MEMDOCK_ADMIN_PASSWORD: ${MEMDOCK_ADMIN_PASSWORD:-}
      MEMDOCK_WRITE_SECRET: ${MEMDOCK_WRITE_SECRET:-}
      MEMDOCK_TRUST_PROXY_TLS: ${MEMDOCK_TRUST_PROXY_TLS:-false}
      MEMDOCK_TRUST_PROXY_CIDRS: ${MEMDOCK_TRUST_PROXY_CIDRS:-}
      MEMDOCK_TLS_CERT: ${MEMDOCK_TLS_CERT:-}
      MEMDOCK_TLS_KEY: ${MEMDOCK_TLS_KEY:-}
    volumes:
      - memdock-data:/data
      - ${MEMDOCK_TLS_DIR:-./certs}:/certs:ro
    ports:
      - "127.0.0.1:${MEMDOCK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "memdock-server", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  memdock-data:
