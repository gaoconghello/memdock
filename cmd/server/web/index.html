<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemDock</title>
<style>
:root{font:16px system-ui,sans-serif;color:#202a35;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#173b57;color:white;padding:1rem max(1rem,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:1.2rem auto;padding:0 1rem}.grid{display:grid;grid-template-columns:260px 1fr;gap:1rem}.card{background:white;border:1px solid #dce2e8;border-radius:9px;padding:1rem;margin-bottom:1rem}h1,h2,h3{margin-top:0}button,select,input,textarea{font:inherit;padding:.55rem;border:1px solid #b8c4ce;border-radius:5px}button{cursor:pointer;background:#e8f1f7}button.primary{background:#17628a;color:white;border:0}input,textarea{width:100%;margin:.25rem 0 .65rem}textarea{min-height:100px}label{display:block;font-size:.9rem}ul{list-style:none;margin:0;padding:0}li{padding:.65rem 0;border-bottom:1px solid #e7ebef}li button{margin-left:.4rem}.muted{color:#657482;font-size:.9rem}.row{display:flex;gap:.5rem;align-items:center}.row>*{flex:1}.pill{background:#e7edf2;padding:.1rem .4rem;border-radius:1rem;font-size:.8rem}.source{color:#17628a}.status{float:right}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}header{align-items:flex-start;gap:.4rem;flex-direction:column}.row{flex-wrap:wrap}}
</style></head><body><header><strong>MemDock <span class="muted" style="color:#c6d9e5">记忆管理</span></strong><span id="health">状态读取中…</span></header><main><section class="card"><h2>项目</h2><div class="row"><select id="projects"></select><button id="reload">刷新</button><button id="rename">重命名</button><button id="merge-project">合并</button><button id="delete-project">删除项目</button></div><p id="project-meta" class="muted"></p><div class="row"><input id="repository" placeholder="Git 仓库地址"><button id="bind">绑定仓库</button><button id="unbind">解绑所填仓库</button></div></section>
<div class="grid"><aside><section class="card"><h3>知识库</h3><select id="kb"><option value="">项目与共享库（默认）</option></select><div class="row"><button id="rename-kb">重命名所选库</button><button id="delete-kb">删除所选库</button></div><div class="row"><select id="kb-target-kind"><option value="project">设为当前项目库</option><option value="shared">设为共享库</option></select><button id="move-kb">调整知识库范围</button></div><label>新建知识库名称<input id="kb-name" placeholder="例如：团队经验"></label><div class="row"><select id="kb-kind"><option value="project">项目库</option><option value="shared">共享库</option></select><button id="create-kb">创建</button></div><p class="muted">查询默认包括当前项目库和共享库。</p></section><section class="card"><h3>搜索</h3><input id="query" placeholder="搜索记忆关键词"><input id="tag-filter" placeholder="标签（可选）"><select id="mem-status"><option value="active">有效记忆</option><option value="deleted">已删除记忆</option></select><button class="primary" id="search">搜索</button><button id="all-memories">显示列表</button></section></aside>
<section><section class="card"><h3>保存记忆</h3><input id="title" placeholder="标题"><textarea id="content" placeholder="记忆内容"></textarea><div class="row"><input id="category" placeholder="分类"><input id="tags" placeholder="标签，以逗号分隔"></div><label><input id="select-kb" type="checkbox" style="width:auto"> 保存到上方选中的知识库（未勾选则使用默认项目库）</label><button id="save" class="primary">保存</button></section><section class="card"><h3>记忆 <span id="count" class="muted"></span></h3><ul id="memories"></ul></section></section></div>
<section class="card"><h3>系统状态</h3><p id="sys" class="muted">读取中…</p><p id="write-security" class="muted">检查浏览器写入安全上下文…</p><p class="muted">阶段一写入授权机制不是人类身份认证。不要在不可信环境输入密钥。</p></section></main>
<script>
const $=s=>document.querySelector(s), state={project:'',projects:[],kbs:[],mode:''};
async function api(path,opts={}){let r=await fetch(path,opts),text=await r.text(),data=text?JSON.parse(text):null;if(!r.ok)throw Error(data?.error||text||r.status);return data}
async function write(method,path,obj){if(state.mode==='secure'){if(!confirm('生成此操作的审批请求文件？此操作不会直接修改服务端数据。请通过可信渠道交给独立审批者。'))throw Error('已取消，未生成审批请求。');let request={method,path,body:obj},blob=new Blob([JSON.stringify(request,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='memdock-approval-request.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);throw Error('审批请求已下载，数据尚未修改。请由独立审批者在其账户/终端运行：memdock-server approve-request memdock-approval-request.json')}if(!window.isSecureContext||!window.crypto?.subtle)throw Error('浏览器不处于安全上下文，已阻止密钥输入和写入。当前页面数据仍可能经 HTTP 明文传输；非 localhost 访问请使用可信 HTTPS，或仅通过可信且加密的内网访问。不要通过非 localhost HTTP 输入密钥。');if(!confirm('确认执行此写入操作？'))throw Error('已取消，未执行写入。');let body=JSON.stringify(obj),key=prompt('输入 MEMDOCK_APPROVAL_KEY（不会保存到页面）');if(!key)throw Error('未提供密钥，未执行写入。');let ts=Math.floor(Date.now()/1000).toString(),nonce=window.crypto.getRandomValues(new Uint8Array(16)),hex=a=>Array.from(a,x=>x.toString(16).padStart(2,'0')).join(''),nonceHex=hex(nonce),msg=`${ts}\n${nonceHex}\n${method}\n${path}\n${body}`,raw=await window.crypto.subtle.importKey('raw',new TextEncoder().encode(key),{name:'HMAC',hash:'SHA-256'},false,['sign']),sig=hex(new Uint8Array(await window.crypto.subtle.sign('HMAC',raw,new TextEncoder().encode(msg))));return api(path,{method,headers:{'Content-Type':'application/json','X-MemDock-Write-Signature':`${ts}:${nonceHex}:${sig}`},body})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function project(){return state.project}
async function init(){let secure=window.isSecureContext&&!!window.crypto?.subtle;$('#write-security').textContent=secure?'写入签名可用（安全上下文）。非 localhost 部署请使用可信 HTTPS；HMAC 不等于用户身份认证。':'非安全上下文：写入已禁用且不会提示输入密钥。当前页面数据仍可能经 HTTP 明文传输；非 localhost 访问请使用可信 HTTPS，或仅通过可信且加密的内网访问。';let status=await api('/api/v1/status');state.mode=status.mode;if(status.mode==='secure')$('#write-security').textContent='Secure 模式：写操作仅导出审批请求文件，不会直接写入；交由独立审批者运行 approve-request CLI。';$('#health').textContent=status.status==='ok'?'服务正常':'异常';$('#sys').textContent=`版本 ${status.version} · 数据库 ${status.database}${status.counts_visible?' · 项目 '+status.projects+' · 有效记忆 '+status.memories:' · 项目/记忆数量仅管理员可见'} · 安全模式：${status.mode}`;let p=await api('/api/v1/projects');state.projects=p.projects;$('#projects').innerHTML=state.projects.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');if(!state.project)state.project=state.projects[0]?.id||'';$('#projects').value=state.project;await loadProject()}
async function loadProject(){state.project=$('#projects').value; if(!project()){ $('#project-meta').textContent='暂无项目，请先通过 Agent 项目初始化流程创建项目。';$('#kb').innerHTML='';$('#memories').innerHTML='';return}let [p,k]=await Promise.all([api('/api/v1/projects/'+encodeURIComponent(project())),api('/api/v1/knowledge-bases')]);$('#project-meta').textContent=`ID ${p.id} · 仓库：${p.repositories?.join(', ')||'未绑定'}`;state.kbs=k.knowledge_bases.filter(x=>x.kind==='shared'||x.project_id===project());$('#kb').innerHTML='<option value="">项目与共享库（默认）</option>'+state.kbs.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${x.kind==='shared'?'共享':'项目'}${x.is_default?'（默认）':''}</option>`).join('');await list()}
async function list(query=''){if(!project())return;let url='/api/v1/memories?project_id='+encodeURIComponent(project())+'&status='+encodeURIComponent($('#mem-status').value);if($('#kb').value)url+='&knowledge_base_id='+encodeURIComponent($('#kb').value);if($('#tag-filter').value)url+='&tag='+encodeURIComponent($('#tag-filter').value);let payload={project_id:project(),query,tag:$('#tag-filter').value};if($('#kb').value)payload.knowledge_base_id=$('#kb').value;let d=query&&query!=='__selected'&&$('#mem-status').value==='active'?await api('/api/v1/memories/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}):await api(url);let items=d.results||d.memories||[];if(query&&query!=='__selected'&&$('#mem-status').value==='deleted'){let q=query.toLocaleLowerCase();items=items.filter(m=>(m.title+' '+m.content).toLocaleLowerCase().includes(q))}$('#count').textContent=`（${items.length}）`;$('#memories').innerHTML=items.map(m=>`<li><strong>${esc(m.title)}</strong> <span class="pill">${esc(m.category)}</span><p>${esc(m.content)}</p><p class="muted">${esc(m.knowledge_base_name||m.knowledge_base_id)}（${esc(m.knowledge_base_type||'')}） · ${esc((m.tags||[]).join(', '))} · 更新 ${esc(m.updated_at||'')}</p><button data-edit="${esc(m.id)}">编辑</button>${m.status==='deleted'?`<button data-restore="${esc(m.id)}">恢复</button>`:`<button data-delete="${esc(m.id)}">删除</button>`}</li>`).join('')||'<li class="muted">没有匹配记忆</li>';}
$('#reload').onclick=()=>init().catch(alert);$('#projects').onchange=()=>loadProject().catch(alert);$('#search').onclick=()=>list($('#query').value.trim()).catch(alert);$('#all-memories').onclick=()=>list('__selected').catch(alert);$('#mem-status').onchange=()=>list().catch(alert);$('#kb').onchange=()=>list('__selected').catch(alert);
$('#save').onclick=async()=>{try{let obj={project_id:project(),title:$('#title').value,content:$('#content').value,category:$('#category').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean)};if($('#select-kb').checked)obj.knowledge_base_id=$('#kb').value;await write('POST','/api/v1/memories',obj);$('#title').value=$('#content').value='';await init()}catch(e){alert(e.message)}};
$('#memories').onclick=async e=>{let id=e.target.dataset.edit||e.target.dataset.delete||e.target.dataset.restore;if(!id)return;try{if(e.target.dataset.edit){let m=await api('/api/v1/memories/'+encodeURIComponent(id)+'?project_id='+encodeURIComponent(project()));let title=prompt('标题',m.title),content=prompt('内容',m.content),tags=prompt('标签（逗号分隔，可留空清除）',(m.tags||[]).join(', '));if(title===null||content===null||tags===null)return;await write('PATCH','/api/v1/memories/'+encodeURIComponent(id),{project_id:project(),title,content,tags:tags.split(',').map(x=>x.trim()).filter(Boolean)})}else if(e.target.dataset.restore)await write('POST','/api/v1/memories/'+encodeURIComponent(id)+'/restore',{project_id:project()});else await write('DELETE','/api/v1/memories/'+encodeURIComponent(id),{project_id:project()});await list()}catch(err){alert(err.message)}};
$('#rename').onclick=async()=>{let name=prompt('项目名称');if(name)try{await write('PATCH','/api/v1/projects/'+encodeURIComponent(project()),{name});await init()}catch(e){alert(e.message)}};
$('#bind').onclick=async()=>{let repository=$('#repository').value.trim();if(repository)try{await write('POST','/api/v1/projects/'+encodeURIComponent(project())+'/repositories',{repository});await loadProject()}catch(e){alert(e.message)}};
$('#unbind').onclick=async()=>{let repository=$('#repository').value.trim();if(repository)try{await write('DELETE','/api/v1/projects/'+encodeURIComponent(project())+'/repositories',{repository});await loadProject()}catch(e){alert(e.message)}};
$('#create-kb').onclick=async()=>{try{await write('POST','/api/v1/knowledge-bases',{name:$('#kb-name').value.trim(),kind:$('#kb-kind').value,...($('#kb-kind').value==='project'?{project_id:project()}:{})});$('#kb-name').value='';await loadProject()}catch(e){alert(e.message)}};
$('#rename-kb').onclick=async()=>{let id=$('#kb').value;if(!id)return alert('先选择知识库');let current=state.kbs.find(x=>x.id===id),name=prompt('知识库名称',current?.name);if(name)try{await write('PATCH','/api/v1/knowledge-bases/'+encodeURIComponent(id),{name});await loadProject()}catch(e){alert(e.message)}};
$('#delete-kb').onclick=async()=>{let id=$('#kb').value;if(!id)return alert('先选择知识库');if(!confirm('删除知识库会永久删除其中记忆，继续？'))return;try{await write('DELETE','/api/v1/knowledge-bases/'+encodeURIComponent(id),{confirm:true});await loadProject()}catch(e){alert(e.message)}};
$('#move-kb').onclick=async()=>{let id=$('#kb').value;if(!id)return alert('先选择知识库');let kind=$('#kb-target-kind').value;try{await write('PATCH','/api/v1/knowledge-bases/'+encodeURIComponent(id),{kind,...(kind==='project'?{project_id:project()}:{})});await loadProject()}catch(e){alert(e.message)}};
$('#merge-project').onclick=async()=>{let target=prompt('输入目标项目 ID');if(target)try{await write('POST','/api/v1/projects/'+encodeURIComponent(project())+'/merge',{target_project_id:target,confirm:true});state.project=target;await init()}catch(e){alert(e.message)}};
$('#delete-project').onclick=async()=>{if(!confirm('永久删除该项目及其记忆？'))return;try{await write('DELETE','/api/v1/projects/'+encodeURIComponent(project()),{confirm:true});state.project='';await init()}catch(e){alert(e.message)}};
init().catch(e=>{$('#health').textContent='服务异常';alert(e.message)});
</script></body></html>
